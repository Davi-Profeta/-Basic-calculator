<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>

</head>

<body>

    <h1>Calculadora</h1>

    <main>

        <section>

            <div class="visor">
                <p id="view"></p>
            </div>

            <div class="teclas">
                
                <div class="buttons">
                    <div class="button">
                        <p class="btns"></p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">AC</p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns"></p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns"></p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">/</p>
                    </div>
                </div>

                <div class="buttons">
                    <div class="button">
                        <p class="btns"></p>
                    </div>
                    <div class="button">
                        <p class="btns">7</p>
                    </div>
                    <div class="button">
                        <p class="btns">8</p>
                    </div>
                    <div class="button">
                        <p class="btns">9</p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">x</p>
                    </div>
                </div>

                <div class="buttons">
                    <div class="button">
                        <p class="btns"></p>
                    </div>
                    <div class="button">
                        <p class="btns">4</p>
                    </div>
                    <div class="button">
                        <p class="btns">5</p>
                    </div>
                    <div class="button">    
                        <p class="btns">6</p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">-</p>
                    </div>
                </div>

                <div class="buttons">
                    <div class="button">
                        <p class="btns"></p>
                    </div>
                    <div class="button">
                        <p class="btns">1</p>
                    </div>
                    <div class="button">
                        <p class="btns">2</p>
                    </div>
                    <div class="button">
                        <p class="btns">3</p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">+</p>
                    </div>
                </div>

                <div class="buttons">
                    <div id="operators" class="button">
                        <p class="btns"></p>
                    </div>
                    <di v class="button">
                        <p class="btns"></p>
                    </di>
                    <div class="button">
                        <p class="btns">0</p>
                    </div>
                    <div class="button">
                        <p class="btns">.</p>
                    </div>
                    <div id="operators" class="button">
                        <p class="btns">=</p>
                    </div>
                </div>

            </div>

        </section>

    </main>
    
    <script src="script.js"></script>
